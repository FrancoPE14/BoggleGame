services:
  # --- BACKEND VM TIER ---
  mysql:
    image: boggle_sql:latest
    container_name: boggle_mysql
    profiles: ["api"]
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-internal # Only these two need to talk internally

  backend:
    build: ./backend
    profiles: ["api"]
    restart: always
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-internal

  # --- FRONTEND VM TIER ---
  frontend:
    build: ./frontend
    profiles: ["ui"]
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data:

networks:
  backend-internal:
    driver: bridge
