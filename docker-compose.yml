services:
  mysql:
    image: mysql:8.0
    container_name: boggle_mysql
    env_file:
      - .env
    ports:
      - "3306:3306"
    restart: unless-stopped
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql # bind mount
    networks:
      - backend

  backend:
    depends_on:
      - mysql
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - frontend

networks:
  backend:
  frontend: