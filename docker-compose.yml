services:
  # --- BACKEND VM TIER ---
  mysql:
    image: boggle_sql:latest
    container_name: boggle_mysql
    profiles: ["api"]
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-internal # Only these two need to talk internally

  backend:
    build: ./backend
    profiles: ["api"]
    restart: always
    env_file: .env
    environment:
      # Override JDBC host to the Compose service name (classpath config may point elsewhere).
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-internal

  # --- FRONTEND VM TIER ---
  # Rewrites `/api/*` on the Next server to BACKEND_BASE_URL (Spring).
  # Default: Docker service hostname when api+ui stacks run together.
  # Override in .env (e.g. http://host.docker.internal:8080) if frontend container talks to backend on host/another VM only.
  frontend:
    build: ./frontend
    profiles: ["ui"]
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8080}
    networks:
      - backend-internal

volumes:
  mysql_data:

networks:
  backend-internal:
    driver: bridge
