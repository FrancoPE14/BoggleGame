plugins {
	id 'jacoco'
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.anteaters'
version = '0.0.1-SNAPSHOT'
description = 'starter project for Boggle Sprint Boot backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
	}
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
	}
	doLast {
		def report = file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
		def parser = new XmlParser()
		parser.setFeature("http://apache.org/xml/features/disallow-doctype-decl", false)
		parser.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)
		def xml = parser.parse(report)
		def counter = xml.counter.find { it.@type == 'INSTRUCTION' }
		def missed = counter.@missed.toInteger()
		def covered = counter.@covered.toInteger()
		def total = missed + covered
		def pct = (covered / total * 100).toInteger()
		println "Total coverage: ${pct}%"
	}
}