stages:
  - lint
  - test

lint:
  stage: lint
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run lint

unit-test:
  stage: test
  image: eclipse-temurin:21
  services:
    - mysql:8.0
  variables:
    MYSQL_DATABASE: boggle
    MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
    MYSQL_USER: boggle_user
    MYSQL_PASSWORD: $MYSQL_PASSWORD
  script:
    - cd backend
    - ./gradlew test jacocoTestReport
    - cat build/reports/jacoco/test/jacocoTestReport.xml | grep -o 'missed="[0-9]*" covered="[0-9]*"' | awk -F'"' 'BEGIN{m=0;c=0} {m+=$2; c+=$4} END{printf "Coverage: %.1f%%\n", c/(m+c)*100}'
  coverage: '/Coverage: \d+\.\d+%/'